name: 'Publish'

# Publishes @silarhi/cap-bundle to npm when a GitHub Release is published.
# The release tag (e.g. v0.2.0) drives the published version — the workflow
# stamps it into package.json, so you never bump the version by hand.
#
# Security: uses npm Trusted Publishing (OIDC) — NO long-lived NPM_TOKEN is
# stored. The job proves its identity to npm with a short-lived id-token, so you
# must first register this repo + workflow as a Trusted Publisher on npmjs.com
# (Package settings -> Trusted Publishers). Provenance is attached automatically.
#
# The id-token never reaches third-party code: `build` runs the devDependencies
# (lint, tests, bundler) without it and packs the tarball; `publish` checks out
# nothing, installs nothing and only uploads that tarball.
#
# A failed release can be re-published with "Run workflow", picking the existing
# tag (not a branch) in "Use workflow from".

on:
    release:
        types: [published]
    workflow_dispatch:

permissions: {}

# A release event and a manual re-run of the same tag must not publish side by side.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    build:
        name: Build @silarhi/cap-bundle
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        defaults:
            run:
                working-directory: assets
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Verify the tag is on main
              run: |
                  if [ "$GITHUB_REF_TYPE" != tag ]; then
                      echo "::error::Publish from a release tag, not from ${GITHUB_REF}."
                      exit 1
                  fi
                  git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
                      echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Refusing to publish."
                      exit 1
                  fi

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: assets/package.json

            # No cache: a poisoned one would end up in the published tarball. setup-node
            # turns the pnpm cache on by itself when package.json has `packageManager`.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26'
                  package-manager-cache: false

            # The release tag is the single source of truth for the version —
            # no manual package.json bump. Both `vX.Y.Z` and `X.Y.Z` tags work.
            - name: Set version from release tag
              id: version
              run: |
                  npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
                  echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify (lint, typecheck, test)
              run: |
                  pnpm lint
                  pnpm typecheck
                  pnpm test

            - name: Build
              run: pnpm build

            - name: Pack
              run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}/package.tgz
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish @silarhi/cap-bundle to npm
        needs: [build]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # npm's Trusted Publisher is pinned to this environment, which only accepts
        # `v*` tags: a branch can't get an id-token npm would accept.
        environment: release
        permissions:
            id-token: write # required for OIDC trusted publishing + provenance
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}

            # No `registry-url`: it writes an .npmrc with `${NODE_AUTH_TOKEN}`, which
            # setup-node v7 no longer stubs. OIDC publishing targets the default
            # registry without any .npmrc.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26'
                  package-manager-cache: false

            # No NODE_AUTH_TOKEN: npm exchanges the OIDC id-token with the registry.
            # npm versions are immutable, so skip (don't red-fail) if this version
            # is already published — makes re-running a release a safe no-op.
            - name: Publish
              run: |
                  if npm view "@silarhi/cap-bundle@${VERSION}" version > /dev/null 2>&1; then
                      echo "@silarhi/cap-bundle@${VERSION} is already published — skipping."
                      exit 0
                  fi
                  npm publish "$RUNNER_TEMP/package.tgz" --provenance --access public
              env:
                  VERSION: ${{ needs.build.outputs.version }}
